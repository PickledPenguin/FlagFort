<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="rift-backdrop-title rift-backdrop-description">
  <title id="rift-backdrop-title">Astral Rift campaign backdrop</title>
  <desc id="rift-backdrop-description">A vast celestial rift illuminates floating moonstone islands, twilight trees, star-metal ore, and void crystals.</desc>
  <g id="rift-backdrop">
    <defs>
      <linearGradient id="rift-sky-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#141329"/>
        <stop offset=".6" stop-color="#343263"/>
        <stop offset="1" stop-color="#6c5484"/>
      </linearGradient>
      <linearGradient id="rift-portal-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7be6ff"/>
        <stop offset=".48" stop-color="#a77bff"/>
        <stop offset="1" stop-color="#ff91e8"/>
      </linearGradient>
      <radialGradient id="rift-glow-gradient">
        <stop offset="0" stop-color="#ecfbff" stop-opacity=".9"/>
        <stop offset=".45" stop-color="#9e8cff" stop-opacity=".38"/>
        <stop offset="1" stop-color="#6f51aa" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect id="rift-sky" width="800" height="180" fill="url(#rift-sky-gradient)"/>
    <ellipse id="rift-glow" cx="414" cy="76" rx="160" ry="106" fill="url(#rift-glow-gradient)"/>
    <g id="starfield" fill="#dff8ff">
