        <stop offset="0" stop-color="#303b39"/>
        <stop offset="1" stop-color="#7d8464"/>
      </linearGradient>
      <linearGradient id="wasteland-toxic-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#58732e"/>
        <stop offset=".5" stop-color="#b2d448"/>
        <stop offset="1" stop-color="#58732e"/>
      </linearGradient>
    </defs>
    <rect id="wasteland-sky" width="800" height="180" fill="url(#wasteland-sky-gradient)"/>
    <circle id="haze-sun" cx="650" cy="40" r="31" fill="#d9df83" opacity=".55"/>
