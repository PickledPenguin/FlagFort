<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="wasteland-backdrop-title wasteland-backdrop-description">
  <title id="wasteland-backdrop-title">Nuclear wasteland campaign backdrop</title>
  <desc id="wasteland-backdrop-description">A radioactive green haze hangs over a ruined city, fractured highway, dead trees, uranium ore, and toxic runoff.</desc>
  <g id="wasteland-backdrop">
