<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="clockwork-tier-title clockwork-tier-description">
  <title id="clockwork-tier-title">Clockwork Citadel campaign tier</title>
  <desc id="clockwork-tier-description">A brass clock tower rises above a fortified mechanical city powered by a glowing aether core.</desc>
  <g id="clockwork-tier-icon">
    <defs>
      <linearGradient id="clockwork-icon-sky-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#273347"/>
        <stop offset="1" stop-color="#5a5148"/>
      </linearGradient>
      <linearGradient id="clockwork-icon-brass-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e0b85f"/>
        <stop offset="1" stop-color="#8b5d2d"/>
      </linearGradient>
    </defs>
    <circle id="clockwork-sky" cx="60" cy="60" r="53" fill="url(#clockwork-icon-sky-gradient)" stroke="#1c222c" stroke-width="5"/>
    <g id="clockwork-smokestacks" fill="#353940" stroke="#20242a" stroke-width="3">
      <path d="M16 76V45h13v31Z"/><path d="M91 76V38h13v38Z"/>
      <path d="M14 45h17v7H14Zm75-7h17v7H89Z" fill="#a26f35"/>
