    <path id="clockwork-citadel" d="M12 102V72h19V59h13V37h32v22h13v13h19v30Z" fill="#51555b" stroke="#22272d" stroke-width="4" stroke-linejoin="round"/>
    <path id="clockwork-roof" d="m40 39 20-19 20 19Z" fill="url(#clockwork-icon-brass-gradient)" stroke="#5d4028" stroke-width="4" stroke-linejoin="round"/>
    <g id="clockwork-clock" stroke="#5b3e26">
