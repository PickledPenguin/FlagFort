      <circle cx="39" cy="69" r="5" fill="#30343b"/>
      <path d="m78 64 4-4-1-5 6-2 3 4 5 1 1 6 4 3-3 5 1 5-6 2-4-3-5 1-2-5-5-3Z"/>
      <circle cx="88" cy="66" r="5" fill="#30343b"/>
