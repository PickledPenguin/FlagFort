    <path id="clockwork-aether-conduit" d="M13 101h33l5-9h18l6 9h33" fill="none" stroke="#76e7df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="clockwork-aether-core" d="m54 103-4-9 10-10 10 10-4 9-6 6Z" fill="#8cf1e3" stroke="#245a61" stroke-width="3" stroke-linejoin="round"/>
