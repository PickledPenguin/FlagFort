        <stop offset=".62" stop-color="#29423e"/>
        <stop offset="1" stop-color="#4d5b48"/>
      </linearGradient>
      <linearGradient id="mire-water-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#315a50"/>
        <stop offset="1" stop-color="#102a2c"/>
      </linearGradient>
      <radialGradient id="mire-moon-glow-gradient">
        <stop offset="0" stop-color="#e4edbd" stop-opacity=".72"/>
        <stop offset="1" stop-color="#cad9b0" stop-opacity="0"/>
      </radialGradient>
    </defs>
