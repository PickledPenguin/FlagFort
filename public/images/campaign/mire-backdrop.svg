<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="mire-backdrop-title mire-backdrop-description">
  <title id="mire-backdrop-title">Drowned Mire campaign backdrop</title>
  <desc id="mire-backdrop-description">Moonlit swamp water surrounds mossy cypress trees, sunken ruins, bog-gold, ghost crystals, and drifting will-o-wisps.</desc>
