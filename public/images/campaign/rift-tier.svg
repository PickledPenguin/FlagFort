<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="rift-tier-title rift-tier-description">
  <title id="rift-tier-title">Astral Rift campaign tier</title>
  <desc id="rift-tier-description">A luminous violet rift opens above moonstone cliffs and radiant void crystals.</desc>
  <g id="rift-tier-icon">
    <defs>
      <radialGradient id="rift-icon-sky-gradient" cx="50%" cy="38%" r="68%">
        <stop offset="0" stop-color="#3e397e"/>
        <stop offset="1" stop-color="#17162f"/>
      </radialGradient>
      <linearGradient id="rift-icon-portal-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7de7ff"/>
        <stop offset=".5" stop-color="#b888ff"/>
        <stop offset="1" stop-color="#fa9cff"/>
      </linearGradient>
    </defs>
    <circle id="astral-sky" cx="60" cy="60" r="53" fill="url(#rift-icon-sky-gradient)" stroke="#111126" stroke-width="5"/>
    <g id="constellations" fill="#d9f5ff">
      <circle cx="29" cy="33" r="2.5"/><circle cx="42" cy="21" r="1.8"/><circle cx="88" cy="29" r="2.2"/><circle cx="98" cy="46" r="1.6"/>
      <path d="m29 33 13-12m46 8 10 17" fill="none" stroke="#91c8ff" stroke-width="1.5" opacity=".7"/>
