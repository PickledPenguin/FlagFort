    <path id="moonstone-ground" d="M9 89 27 77l16 7 16-15 16 13 14-8 22 15v20H9Z" fill="#4a4c76" stroke="#242541" stroke-width="4" stroke-linejoin="round"/>
    <g id="void-crystals" fill="#8fe9ff" stroke="#372d69" stroke-width="3" stroke-linejoin="round">
      <path d="m25 101 5-20 7 12-3 11Z"/><path d="m33 103 7-13 6 12Z"/>
      <path d="m88 103 5-22 8 14-4 9Z"/>
