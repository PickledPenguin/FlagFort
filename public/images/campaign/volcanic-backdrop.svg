        <stop offset="1" stop-color="#70413d"/>
      </linearGradient>
      <linearGradient id="volcanic-lava-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d8432f"/>
        <stop offset=".5" stop-color="#ff9a3c"/>
        <stop offset="1" stop-color="#d8432f"/>
      </linearGradient>
    </defs>
