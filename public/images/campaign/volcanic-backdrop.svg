<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="volcanic-backdrop-title volcanic-backdrop-description">
  <title id="volcanic-backdrop-title">Volcanic campaign backdrop</title>
  <desc id="volcanic-backdrop-description">A vast erupting volcano overlooks basalt ridges, glowing lava rivers, ember crystals, and charred trees.</desc>
