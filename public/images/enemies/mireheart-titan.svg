      <stop id="bark-mid" offset=".52" stop-color="#455b50"/>
      <stop id="bark-shadow" offset="1" stop-color="#263c3a"/>
    </linearGradient>
    <radialGradient id="sealed-mireheart">
      <stop id="heart-center" offset="0" stop-color="#efffd5"/>
      <stop id="heart-glow" offset=".45" stop-color="#83e6b0"/>
      <stop id="heart-edge" offset="1" stop-color="#357b70"/>
    </radialGradient>
  </defs>
