<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -54 120 108" role="img" aria-labelledby="title description">
  <title id="title">Comet Slinger zombie</title>
  <desc id="description">An astral ranged zombie in a star-chart mantle, winding back to throw a bright comet with a long celestial tail.</desc>
  <defs id="comet-slinger-definitions">
    <radialGradient id="comet-core-gradient" cx="36%" cy="32%" r="68%">
      <stop offset="0" stop-color="#fff7c7"/>
      <stop offset=".42" stop-color="#7cecff"/>
      <stop offset="1" stop-color="#8874ef"/>
    </radialGradient>
    <linearGradient id="comet-tail-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cecff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c4a4ff" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <g id="comet-slinger-zombie">
    <path id="comet-tail" d="M12-44C25-45 35-39 44-31 34-34 26-30 19-25 19-34 15-39 12-44Z" fill="url(#comet-tail-gradient)"/>
    <g id="orbit-sparks" fill="#c9f8ff">
      <path id="spark-one" d="m14-48 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z"/>
      <circle id="spark-two" cx="37" cy="-45" r="2.5" fill="#d6a5ff"/>
      <circle id="spark-three" cx="51" cy="-25" r="2"/>
    </g>
    <g id="slinging-arms" fill="none" stroke="#625da0" stroke-width="9" stroke-linecap="round">
      <path id="throwing-arm" d="M7-15 27-28 43-21"/>
      <path id="balancing-arm" d="M8 15 30 23 44 13"/>
    </g>
    <g id="hands" fill="#7770bb" stroke="#292c5d" stroke-width="2.5">
      <circle id="throwing-hand" cx="44" cy="-21" r="8"/>
      <circle id="balancing-hand" cx="44" cy="13" r="8"/>
    </g>
    <circle id="body" r="27" fill="#6660a5" stroke="#292c5d" stroke-width="3"/>
    <path id="star-chart-mantle" d="M-23-19-8-27 6-21 21-25 29-10 16-4 3-10-11-5-26-10Z" fill="#272c65" stroke="#171a42" stroke-width="3" stroke-linejoin="round"/>
    <g id="mantle-constellation" fill="#9feeff" stroke="#9feeff" stroke-width="1.5">
      <circle id="mantle-star-one" cx="-13" cy="-17" r="2"/>
      <circle id="mantle-star-two" cx="1" cy="-20" r="2"/>
      <circle id="mantle-star-three" cx="14" cy="-14" r="2"/>
      <path id="mantle-star-lines" d="m-11-17 10-3m4 0 9 5" fill="none" opacity=".7"/>
    </g>
    <g id="eyes" fill="#effdff" stroke="#292c5d" stroke-width="1.5">
      <ellipse id="upper-eye" cx="8" cy="-9" rx="6.5" ry="4.5" transform="rotate(21 8 -9)"/>
      <ellipse id="lower-eye" cx="8" cy="9" rx="6.5" ry="4.5" transform="rotate(-21 8 9)"/>
    </g>
    <g id="pupils" fill="#7cecff">
      <circle id="upper-pupil" cx="11" cy="-8" r="2.6"/>
      <circle id="lower-pupil" cx="11" cy="8" r="2.6"/>
    </g>
    <g id="held-comet">
      <circle id="comet-core" cx="49" cy="-31" r="11" fill="url(#comet-core-gradient)" stroke="#4a4c9e" stroke-width="3"/>
      <path id="comet-highlight" d="M44-35c3-3 7-2 9 0" fill="none" stroke="#fffbd8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
