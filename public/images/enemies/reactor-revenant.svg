      <path id="right-upper-arm" d="M35-32 68-52 84-33 69-7 43 0Z"/>
      <path id="right-lower-arm" d="M41 8 79 19 78 44 50 54 29 32Z"/>
    </g>
    <g id="toxic-canisters" stroke="#25352e" stroke-width="5">
      <path id="left-canister" d="M-70 7h18v43h-18Z" fill="#70823d"/>
      <path id="right-canister" d="M56-35h18V5H56Z" fill="#70823d"/>
      <path id="left-canister-window" d="M-67 20h12v18h-12Z" fill="#b7e74c"/>
      <path id="right-canister-window" d="M59-23h12v17H59Z" fill="#b7e74c"/>
    </g>
    <ellipse id="body" cx="-2" cy="4" rx="57" ry="61" fill="#596e51" stroke="#263a2d" stroke-width="7"/>
