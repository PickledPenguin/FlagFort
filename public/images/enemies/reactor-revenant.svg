      <circle id="fallout-speck-two" cx="70" cy="-36" r="3"/>
      <circle id="fallout-speck-three" cx="-77" cy="35" r="2.5"/>
      <path id="toxic-wisp" d="M65 52c-10-12 8-17-1-30 19 9 17 24 8 34Z"/>
    </g>
    <g id="massive-arms" fill="#637357" stroke="#29392f" stroke-width="6">
