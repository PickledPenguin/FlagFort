<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="reactor-revenant-svg" sodipodi:docname="reactor-revenant.svg" inkscape:version="1.4.4">
  <title id="title">Reactor Revenant boss</title>
  <desc id="description">A colossal wasteland zombie sealed inside riveted reactor armor, carrying toxic canisters and a warning siren above its glowing containment core.</desc>
  <defs id="definitions">
    <linearGradient id="containment-steel" x1="0" y1="0" x2="1" y2="1">
      <stop id="steel-highlight" offset="0" stop-color="#879178"/>
      <stop id="steel-mid" offset=".52" stop-color="#515b4c"/>
      <stop id="steel-shadow" offset="1" stop-color="#28312d"/>
    </linearGradient>
    <radialGradient id="sealed-reactor-core">
      <stop id="core-center" offset="0" stop-color="#efff85"/>
      <stop id="core-mid" offset=".48" stop-color="#91d63c"/>
      <stop id="core-edge" offset="1" stop-color="#326f39"/>
    </radialGradient>
  </defs>
  <g id="reactor-revenant" transform="translate(90 92)" stroke-linejoin="round">
