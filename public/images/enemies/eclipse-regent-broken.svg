      <path id="right-crown-fragment" d="M10-53 33-68 41-37 20-27Z"/>
      <path id="left-shoulder-fragment" d="M-55-32-29-45-17-29-31-13-53-5Z"/>
      <path id="right-shoulder-fragment" d="M19-28 32-44 56-30 51-4 34-14Z"/>
      <path id="lower-fragment" d="M-42 45-24 36-10 55 3 68-29 62Z"/>
