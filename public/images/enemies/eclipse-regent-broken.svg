      <path id="right-arm" d="M39-31 69-22 83 7 68 34 42 16Z"/>
    </g>
    <ellipse id="body" cx="0" cy="4" rx="56" ry="62" fill="#5a477b" stroke="#241d49" stroke-width="7"/>
    <g id="rift-cracks" fill="none" stroke="#72f3ff" stroke-width="4" stroke-linecap="round">
      <path id="left-crack" d="M-48-11-31-4-39 9-25 17"/>
      <path id="right-crack" d="M45-6 31 2 40 14 27 22"/>
