<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="eclipse-regent-broken-svg" sodipodi:docname="eclipse-regent-broken.svg" inkscape:version="1.4.4">
  <title id="title">Eclipse Regent with shattered armor</title>
  <desc id="description">The Eclipse Regent after its moon armor shatters, exposing a dark singularity surrounded by violent cyan and violet rift energy.</desc>
  <defs id="definitions">
    <radialGradient id="open-singularity">
      <stop id="void-center" offset="0" stop-color="#08091d"/>
      <stop id="void-edge" offset=".48" stop-color="#21145c"/>
      <stop id="accretion-ring" offset=".7" stop-color="#a44eff"/>
      <stop id="accretion-glow" offset="1" stop-color="#62f0ff"/>
    </radialGradient>
    <linearGradient id="broken-moon-armor" x1="0" y1="0" x2="1" y2="1">
      <stop id="broken-highlight" offset="0" stop-color="#dff8ff"/>
      <stop id="broken-shadow" offset="1" stop-color="#465486"/>
    </linearGradient>
  </defs>
  <g id="eclipse-regent-broken" transform="translate(90 92)" stroke-linejoin="round">
    <g id="unstable-rift" fill="none" stroke-linecap="round">
