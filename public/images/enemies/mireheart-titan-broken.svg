<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="mireheart-titan-broken-svg" sodipodi:docname="mireheart-titan-broken.svg" inkscape:version="1.4.4">
  <title id="title">Mireheart Titan with shattered armor</title>
  <desc id="description">The Mireheart Titan after its cypress shell ruptures, exposing a brilliant parasitic swamp heart and grasping leech-like tendrils.</desc>
  <defs id="definitions">
    <linearGradient id="broken-cypress" x1="0" y1="0" x2="1" y2="1">
      <stop id="bark-highlight" offset="0" stop-color="#68796a"/>
      <stop id="bark-shadow" offset="1" stop-color="#273d39"/>
    </linearGradient>
    <radialGradient id="exposed-mireheart">
      <stop id="heart-white" offset="0" stop-color="#ffffff"/>
      <stop id="heart-lime" offset=".32" stop-color="#d7ff8f"/>
      <stop id="heart-teal" offset=".7" stop-color="#55e6ad"/>
      <stop id="heart-dark" offset="1" stop-color="#287468"/>
    </radialGradient>
  </defs>
  <g id="mireheart-titan-broken" transform="translate(90 91)" stroke-linejoin="round">
    <g id="surging-bog-aura" fill="none" stroke-linecap="round">
      <ellipse id="water-ring" cx="0" cy="65" rx="78" ry="17" stroke="#86e0bd" stroke-width="5" opacity=".7"/>
      <path id="left-surge" d="M-82 43c14-10 29-9 43 0" stroke="#b8ffd8" stroke-width="3"/>
      <path id="right-surge" d="M41 42c14-8 28-7 41 3" stroke="#b8ffd8" stroke-width="3"/>
    </g>
    <g id="root-legs" fill="url(#broken-cypress)" stroke="#17312f" stroke-width="7">
      <path id="left-root-leg" d="M-39 36-54 65-78 72-48 78-19 58-13 34Z"/>
      <path id="right-root-leg" d="M17 34 25 60 48 78 78 70 53 64 40 36Z"/>
    </g>
    <g id="massive-arms" fill="#3e5b51" stroke="#173331" stroke-width="7">
      <path id="left-arm" d="M-42-27-70-17-82 17-67 42-39 19Z"/>
      <path id="right-arm" d="M42-28 70-17 82 17 67 43 39 19Z"/>
    </g>
    <ellipse id="drowned-body" cx="0" cy="5" rx="56" ry="63" fill="#3f5d52" stroke="#16312f" stroke-width="7"/>
    <circle id="heart-glow" cx="0" cy="19" r="38" fill="#6ff0b2" opacity=".24"/>
    <circle id="exposed-heart" cx="0" cy="19" r="27" fill="url(#exposed-mireheart)" stroke="#174f47" stroke-width="6"/>
    <path id="heart-pulse" d="M-13 20-5 11 2 25 10 8 17 18" fill="none" stroke="#efffd3" stroke-width="5" stroke-linecap="round"/>
    <g id="shattered-shell" fill="url(#broken-cypress)" stroke="#203b37" stroke-width="6">
      <path id="broken-crown" d="M-43-38-36-71-18-57-8-79 3-57 20-70 16-43-4-30-22-27Z"/>
      <path id="left-shoulder" d="M-58-32-31-51-12-34-24-9-54-1Z"/>
      <path id="right-shoulder" d="M13-31 31-50 58-31 54-1 25-10Z"/>
      <path id="left-seal-shard" d="M-30-1-13-17-5-3-15 13-30 25Z"/>
      <path id="right-seal-shard" d="M11-13 29 3 30 26 14 12Z"/>
      <path id="rooted-waist" d="M-49 34-29 28-13 51 10 52 27 29 49 35 39 61 16 71 0 62-17 72-40 61Z"/>
    </g>
    <g id="draining-tendrils" fill="none" stroke="#89e49c" stroke-width="5" stroke-linecap="round">
