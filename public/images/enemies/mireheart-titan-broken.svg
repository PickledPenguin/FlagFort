      <path id="right-tendril" d="M20 16C45 3 59 12 65 30"/>
      <path id="lower-tendril" d="M2 45c-2 11-11 17-23 20"/>
    </g>
    <g id="face" stroke="#14302d" stroke-width="4" stroke-linecap="round">
