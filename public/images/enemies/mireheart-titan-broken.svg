      <path id="right-eye" d="m8-18 16-6 7 9-18 6Z" fill="#e5ffb8"/>
      <path id="mouth" d="m-20-2 11-7 13 8 14-9" fill="none" stroke-width="5"/>
    </g>
    <g id="spore-burst" fill="#caff9a">
