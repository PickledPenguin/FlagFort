<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="chronoforge-colossus-broken-svg" sodipodi:docname="chronoforge-colossus-broken.svg" inkscape:version="1.4.4">
  <title id="title">Chronoforge Colossus with shattered armor</title>
  <desc id="description">The Chronoforge Colossus after its clock armor bursts apart, exposing an overcharged cyan aether heart amid racing gears and electrical arcs.</desc>
  <defs id="definitions">
    <linearGradient id="broken-brass" x1="0" y1="0" x2="1" y2="1">
      <stop id="brass-highlight" offset="0" stop-color="#f1cf77"/>
      <stop id="brass-shadow" offset="1" stop-color="#76502c"/>
    </linearGradient>
    <linearGradient id="steel-body" x1="0" y1="0" x2="0" y2="1">
      <stop id="steel-highlight" offset="0" stop-color="#748087"/>
      <stop id="steel-shadow" offset="1" stop-color="#30383e"/>
    </linearGradient>
    <radialGradient id="overcharged-core">
      <stop id="core-center" offset="0" stop-color="#ffffff"/>
      <stop id="core-hot" offset=".32" stop-color="#b9fff9"/>
      <stop id="core-aether" offset=".68" stop-color="#55e7df"/>
      <stop id="core-edge" offset="1" stop-color="#23727a"/>
    </radialGradient>
  </defs>
  <g id="chronoforge-colossus-broken" transform="translate(90 92)" stroke-linejoin="round">
    <g id="overclocked-flywheel" fill="none" stroke-linecap="round">
      <circle id="broken-flywheel" cx="0" cy="-22" r="61" stroke="#d99a42" stroke-width="12" stroke-dasharray="19 8 5 8"/>
      <circle id="aether-ring" cx="0" cy="-22" r="52" stroke="#79eee6" stroke-width="4" stroke-dasharray="17 7"/>
      <path id="speed-arcs" d="M-63-55c19-20 42-27 66-24M62 15c-18 18-40 25-65 23" stroke="#f1cf77" stroke-width="5"/>
    </g>
    <g id="piston-legs" fill="url(#steel-body)" stroke="#22292e" stroke-width="7">
      <path id="left-leg" d="M-41 36-54 71-77 77-44 82-18 59-13 32Z"/>
      <path id="right-leg" d="M15 32 20 59 45 82 77 76 53 70 41 35Z"/>
    </g>
    <g id="overdriven-arms" fill="url(#steel-body)" stroke="#22292e" stroke-width="7">
      <path id="left-arm" d="M-44-27-72-18-83 15-65 42-39 17Z"/>
      <path id="right-arm" d="M43-28 71-18 83 14 66 42 39 17Z"/>
    </g>
    <ellipse id="iron-body" cx="0" cy="5" rx="55" ry="62" fill="url(#steel-body)" stroke="#22292e" stroke-width="7"/>
    <g id="aether-cracks" fill="none" stroke="#7afff5" stroke-width="4" stroke-linecap="round">
      <path id="left-crack" d="M-47-12-32-4-40 10-27 18"/>
      <path id="right-crack" d="M46-8 31 2 40 14 27 23"/>
      <path id="lower-crack" d="M-9 51 0 39 10 52 18 63"/>
    </g>
    <circle id="exposed-aether-heart" cx="0" cy="18" r="32" fill="url(#overcharged-core)" stroke="#89fff7" stroke-width="5"/>
    <g id="heart-gears" fill="none" stroke="#285d63" stroke-width="4">
      <circle id="outer-heart-gear" cx="0" cy="18" r="23" stroke-dasharray="7 4"/>
      <circle id="inner-heart-gear" cx="0" cy="18" r="10"/>
      <path id="heart-spokes" d="M0-5v13M0 28v13M-23 18h13M10 18h13"/>
    </g>
    <g id="surviving-armor" fill="url(#broken-brass)" stroke="#5c3e27" stroke-width="6">
      <path id="left-crown-fragment" d="M-41-39-33-68-16-56-19-29Z"/>
      <path id="right-crown-fragment" d="M12-54 35-68 42-37 20-27Z"/>
      <path id="left-shoulder-fragment" d="M-56-33-30-49-17-30-31-13-53-4Z"/>
      <path id="right-shoulder-fragment" d="M19-29 31-48 57-32 52-3 35-14Z"/>
      <path id="lower-fragment" d="M-43 45-25 35-10 55 3 69-30 63Z"/>
    </g>
    <g id="clock-shards" fill="#e8d39c" stroke="#634329" stroke-width="3">
      <path id="dial-shard-one" d="m-70-47 14-7 5 16-14 7Z"/>
      <path id="dial-shard-two" d="m67-44 14 8-9 14-12-9Z"/>
      <path id="dial-shard-three" d="m64 49 15 4-10 13-12-6Z"/>
      <path id="dial-shard-four" d="m-69 48 12-4-2 15-13 4Z"/>
      <path id="loose-clock-hand" d="m50 56 17 10-4 5-18-9Z" fill="#30383e"/>
    </g>
    <g id="face" stroke="#20272c" stroke-width="4" stroke-linecap="round">
      <path id="left-eye" d="m-27-25 14-4 7 9-16 5Z" fill="#f7d36f"/>
      <path id="right-eye" d="m8-20 15-5 7 9-17 6Z" fill="#f7d36f"/>
      <path id="mouth" d="m-19-4 10-7 13 9 12-8" fill="none" stroke-width="5"/>
    </g>
    <g id="aether-arcs" fill="none" stroke="#a2fff8" stroke-width="4" stroke-linecap="round">
      <path id="left-arc" d="M-78 12-67 4-62 16-50 8"/>
      <path id="right-arc" d="M52 7 62 17 68 4 79 12"/>
      <path id="upper-arc" d="M-19-66-8-57 0-71 11-57 22-67"/>
    </g>
  </g>
</svg>
