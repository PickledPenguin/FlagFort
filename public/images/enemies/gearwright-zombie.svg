<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -52 116 104" role="img" aria-labelledby="title description">
  <title id="title">Gearwright zombie</title>
  <desc id="description">A hunched clockwork engineer carrying a rotating gear halo, mechanical tools, and a glowing aether command beacon.</desc>
  <defs id="gearwright-definitions">
    <linearGradient id="gearwright-apron-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#765c3d"/>
      <stop offset="1" stop-color="#3c332b"/>
    </linearGradient>
    <radialGradient id="gearwright-beacon-gradient">
      <stop offset="0" stop-color="#effffc"/>
      <stop offset="0.4" stop-color="#79e7df"/>
      <stop offset="1" stop-color="#247c82"/>
    </radialGradient>
  </defs>
  <g id="gearwright-zombie">
    <g id="gear-halo" fill="#c49542" stroke="#554022" stroke-width="3" stroke-linejoin="round">
      <path id="outer-gear" d="m0-50 6 8 10-3 2 10 11 1-2 10 9 6-7 8 5 10-10 4-1 11-11-1-6 9-8-6-10 5-4-10-11-1 1-11-9-6 7-8-5-10 10-4 2-11 10 2Z"/>
      <circle id="halo-cutout" cx="0" cy="-13" r="22" fill="#222b31"/>
      <circle id="halo-rim" cx="0" cy="-13" r="15" fill="none" stroke="#e0b85b" stroke-width="4"/>
    </g>
    <g id="legs" fill="none" stroke="#414a4d" stroke-width="10" stroke-linecap="round">
      <path id="rear-leg" d="M-13 24-24 45"/>
      <path id="front-leg" d="M13 24 27 44"/>
    </g>
    <path id="body" d="M-27-8C-25-29-7-38 13-32 31-25 34 0 25 28H-23C-29 13-31 2-27-8Z" fill="url(#gearwright-apron-gradient)" stroke="#292822" stroke-width="3"/>
    <path id="head" d="M-17-28C-4-39 15-34 22-20 23-4 13 6-2 4-16 2-23-14-17-28Z" fill="#6d8177" stroke="#283a39" stroke-width="3"/>
    <path id="visor" d="M-17-20C-4-27 10-27 22-20L17-11C6-16-5-14-13-9Z" fill="#2b3538" stroke="#a97834" stroke-width="2"/>
    <g id="visor-lights" fill="#79e7df">
      <rect id="left-light" x="-9" y="-21" width="7" height="4" rx="2"/>
      <rect id="right-light" x="6" y="-22" width="7" height="4" rx="2"/>
    </g>
    <g id="tool-arms" fill="none" stroke="#64776e" stroke-width="8" stroke-linecap="round">
      <path id="wrench-arm" d="M-22-2-40 11"/>
      <path id="beacon-arm" d="M23-3 39 7"/>
    </g>
    <path id="wrench" d="m-39 10-10 10m1-16 8 7-1 11" fill="none" stroke="#c5ced0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="command-beacon">
      <path id="beacon-handle" d="M39 7 45-9" fill="none" stroke="#b9863a" stroke-width="5" stroke-linecap="round"/>
      <circle id="beacon-cage" cx="47" cy="-15" r="10" fill="#28383c" stroke="#d0a54c" stroke-width="3"/>
      <circle id="beacon-core" cx="47" cy="-15" r="6" fill="url(#gearwright-beacon-gradient)"/>
      <path id="signal-one" d="M37-30C44-36 52-35 57-28" fill="none" stroke="#79e7df" stroke-width="2" stroke-linecap="round"/>
      <path id="signal-two" d="M41-25c4-3 8-3 12 0" fill="none" stroke="#79e7df" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="apron-gears" fill="#d0a44b" stroke="#574125" stroke-width="2">
      <circle id="large-apron-gear" cx="2" cy="16" r="9"/>
      <circle id="small-apron-gear" cx="17" cy="9" r="6"/>
      <circle id="large-axle" cx="2" cy="16" r="3" fill="#343a3d"/>
      <circle id="small-axle" cx="17" cy="9" r="2" fill="#343a3d"/>
    </g>
  </g>
</svg>
