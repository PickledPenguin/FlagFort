<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -52 116 104" role="img" aria-labelledby="title description">
  <title id="title">Drowned Bulwark zombie with broken shield</title>
  <desc id="description">A massive drowned zombie advancing after its mossy ruin shield has shattered into stone fragments.</desc>
  <defs id="drowned-bulwark-broken-definitions">
    <linearGradient id="drowned-bulwark-broken-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60776d"/>
      <stop offset="1" stop-color="#2b4543"/>
    </linearGradient>
  </defs>
  <g id="drowned-bulwark-broken-zombie">
    <g id="heavy-legs" fill="none" stroke="#304c49" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path id="rear-leg" d="M-18 18-30 39-46 36"/>
      <path id="front-leg" d="M12 19 25 39 42 35"/>
    </g>
    <ellipse id="body" cx="-5" cy="1" rx="34" ry="29" fill="url(#drowned-bulwark-broken-body-gradient)" stroke="#1d3736" stroke-width="3"/>
    <path id="broken-stone-crown" d="m-26-19 4-15 10 5 9-19 9 17 11-5 6 18Z" fill="#596a64" stroke="#2c403d" stroke-width="3" stroke-linejoin="round"/>
    <g id="crown-moss" fill="#78925b">
