<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -52 116 104" role="img" aria-labelledby="title description">
  <title id="title">Rift Strider zombie</title>
  <desc id="description">A compact astral zombie phasing through a luminous rift, with floating clawed hands and a stardust trail.</desc>
  <defs id="rift-strider-definitions">
    <linearGradient id="rift-strider-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7865b8"/>
      <stop offset="1" stop-color="#34356f"/>
    </linearGradient>
    <linearGradient id="rift-strider-rift-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cecff"/>
      <stop offset=".55" stop-color="#a58cff"/>
      <stop offset="1" stop-color="#e49cff"/>
    </linearGradient>
  </defs>
  <g id="rift-strider-zombie">
    <g id="phase-rift" fill="none" stroke="url(#rift-strider-rift-gradient)" stroke-linecap="round">
      <path id="outer-rift" d="M-35-42C-54-25-54 26-34 43" stroke-width="6"/>
      <path id="inner-rift" d="M-27-31C-39-17-39 18-26 32" stroke-width="3" opacity=".72"/>
    </g>
    <g id="stardust-trail" fill="#9feeff">
      <path id="trail-shard-one" d="m-45-32 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z"/>
      <circle id="trail-star-two" cx="-49" cy="8" r="2.5"/>
      <circle id="trail-star-three" cx="-40" cy="32" r="3.5" fill="#d6a5ff"/>
    </g>
    <path id="phase-tail" d="M-34-20C-18-27-11-17 1-14L0 18c-14 2-22 13-34 5 8-6 9-14 2-20 8-7 8-15-2-23Z" fill="#4f478c" opacity=".82"/>
    <g id="floating-hands" fill="#6562a8" stroke="#252952" stroke-width="2.5">
      <circle id="upper-hand" cx="44" cy="-20" r="9"/>
      <circle id="lower-hand" cx="44" cy="17" r="9"/>
    </g>
    <ellipse id="body" cx="-1" rx="27" ry="24" fill="url(#rift-strider-body-gradient)" stroke="#252952" stroke-width="3"/>
    <path id="phase-cowl" d="M-21-19C-14-36 11-38 26-20L15-12C6-24-8-24-17-12Z" fill="#282b62" stroke="#181b42" stroke-width="3" stroke-linejoin="round"/>
    <g id="eyes" fill="#dffcff" stroke="#252952" stroke-width="1.5">
      <path id="upper-eye" d="m2-12 17 3L5-3Z"/>
      <path id="lower-eye" d="m2 12 17-3L5 3Z"/>
    </g>
    <g id="pupils" fill="#b785ff">
      <circle id="upper-pupil" cx="11" cy="-8" r="2.5"/>
      <circle id="lower-pupil" cx="11" cy="8" r="2.5"/>
    </g>
    <g id="phase-claws" fill="none" stroke="#9feeff" stroke-width="3" stroke-linecap="round">
      <path id="upper-claws" d="m43-21 11-7m-10 8 12 1m-13 0 8 9"/>
      <path id="lower-claws" d="m43 17 11-7m-10 8 12 1m-13-1 8 9"/>
    </g>
  </g>
</svg>
