      <circle id="inner-flywheel" cx="0" cy="-22" r="52"/>
      <path id="flywheel-spokes" d="M0-74v18M0 12v18M-52-22h18M34-22h18M-37-59l13 13M24 2l13 13M37-59 24-46M-24 2-37 15" stroke="#d39b48" stroke-width="6"/>
    </g>
    <g id="piston-legs" fill="url(#steel-body)" stroke="#22292e" stroke-width="7">
      <path id="left-leg" d="M-41 36-54 71-77 77-44 82-18 59-13 32Z"/>
      <path id="right-leg" d="M15 32 20 59 45 82 77 76 53 70 41 35Z"/>
    </g>
    <g id="piston-arms" stroke="#2a3035" stroke-width="7">
      <path id="left-arm" d="M-44-27-72-18-83 15-65 42-39 17Z" fill="url(#steel-body)"/>
      <path id="right-arm" d="M43-28 71-18 83 14 66 42 39 17Z" fill="url(#steel-body)"/>
      <path id="left-piston" d="m-70-8-13 23 16 24 12-28Z" fill="url(#brass-armor)"/>
