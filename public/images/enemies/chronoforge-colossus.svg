    </g>
    <ellipse id="iron-body" cx="0" cy="5" rx="55" ry="62" fill="url(#steel-body)" stroke="#22292e" stroke-width="7"/>
    <circle id="sealed-core" cx="0" cy="18" r="27" fill="url(#sealed-aether-core)" stroke="#24484d" stroke-width="8"/>
    <g id="citadel-armor" fill="url(#brass-armor)" stroke="#5c3e27" stroke-width="6">
      <path id="clock-crown" d="M-42-39-34-68-16-57 0-78 16-56 35-69 43-38 19-24-19-25Z"/>
      <path id="left-shoulder" d="M-57-34-29-51-8-31-20-8-54-2Z"/>
      <path id="right-shoulder" d="M9-31 30-51 57-33 54-2 20-8Z"/>
      <path id="clock-breastplate" d="M-31-2-15-19 13-17 31 2 31 31 13 49-15 45-32 26Z"/>
      <path id="boiler-waist" d="M-49 36-28 26-10 51 11 51 28 27 49 36 39 63 15 72 0 62-16 72-40 62Z"/>
    </g>
    <g id="clock-face" fill="#e2b85d" stroke="#62442a" stroke-linecap="round">
