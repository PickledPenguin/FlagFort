<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="chronoforge-colossus-svg" sodipodi:docname="chronoforge-colossus.svg" inkscape:version="1.4.4">
  <title id="title">Chronoforge Colossus boss</title>
  <desc id="description">A colossal clockwork zombie sealed in riveted brass armor, with piston fists, a gear halo, and a clock face guarding its aether heart.</desc>
  <defs id="definitions">
    <linearGradient id="brass-armor" x1="0" y1="0" x2="1" y2="1">
      <stop id="brass-highlight" offset="0" stop-color="#f1cf77"/>
      <stop id="brass-mid" offset=".5" stop-color="#b87935"/>
      <stop id="brass-shadow" offset="1" stop-color="#644326"/>
    </linearGradient>
    <linearGradient id="steel-body" x1="0" y1="0" x2="0" y2="1">
      <stop id="steel-highlight" offset="0" stop-color="#68747b"/>
      <stop id="steel-shadow" offset="1" stop-color="#30383e"/>
    </linearGradient>
    <radialGradient id="sealed-aether-core">
      <stop id="core-center" offset="0" stop-color="#eaffff"/>
      <stop id="core-mid" offset=".48" stop-color="#79e7df"/>
      <stop id="core-edge" offset="1" stop-color="#28575c"/>
    </radialGradient>
  </defs>
  <g id="chronoforge-colossus" transform="translate(90 92)" stroke-linejoin="round">
    <g id="flywheel-halo" fill="none" stroke="url(#brass-armor)" stroke-width="8">
