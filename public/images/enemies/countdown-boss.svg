  <title
     id="title">Briar Behemoth boss</title>
  <desc
     id="desc">A huge four-armed forest zombie wearing a simple thornwood crown and vine chest plate.</desc>
  <metadata
     id="editor-metadata">FlagFort editable Forest Frontier boss artwork. Arms, body, crown, vines, face, and thorns remain separate named groups.<rdf:RDF>
  <cc:Work
     rdf:about="">
    <dc:title>Briar Behemoth boss</dc:title>
  </cc:Work>
</rdf:RDF>
</metadata>
