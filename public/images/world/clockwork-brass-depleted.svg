<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Depleted clockwork brass deposit</title>
  <desc id="description">A cracked black rock with tarnished scraps left where its brass plates were removed.</desc>
  <g id="clockwork-brass-depleted">
    <ellipse id="shadow" cx="48" cy="86" rx="37" ry="6" fill="#17191d" opacity=".74"/>
    <path id="rubble" d="m10 76 15-24 21-8 13 10 14-3 15 25-18 10H27Z" fill="#3d4249" stroke="#24282d" stroke-width="6" stroke-linejoin="round"/>
    <path id="empty-seam" d="m25 60 13-7 10 6 11-9 15 8-10 8 12 8-17 6-11-8-12 7-14-5Z" fill="#282c31" stroke="#5c472c" stroke-width="3" stroke-linejoin="round"/>
    <path id="tarnished-scraps" d="m18 69 9-3 4 8-10 4Zm49 3 9-4 5 7-9 5Z" fill="#8c763d" stroke="#493d28" stroke-width="3" stroke-linejoin="round"/>
    <circle id="remaining-rivet" cx="47" cy="64" r="2.5" fill="#b5944b"/>
  </g>
</svg>
