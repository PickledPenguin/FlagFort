<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-128 -128 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Time Lock burst</title>
  <desc id="desc">A cyan clockwork ring with chain links and aether ticks, designed to expand from its centered pivot.</desc>
  <metadata>FlagFort editable gameplay asset. Center pivot: 0,0. Preserve layer and element IDs for editing.</metadata>
  <g id="time-lock-burst" aria-label="Time Lock burst">
    <circle id="aether-halo" cx="0" cy="0" r="112" fill="#79e7df" fill-opacity=".08" stroke="#79e7df" stroke-opacity=".34" stroke-width="8"/>
    <g id="clock-ring" fill="none" stroke-linecap="round">
      <circle id="outer-ring" cx="0" cy="0" r="104" stroke="#b7fff8" stroke-width="6"/>
      <circle id="inner-ring" cx="0" cy="0" r="88" stroke="#2d7f83" stroke-width="4" stroke-dasharray="9 7"/>
      <g id="hour-ticks" stroke="#d9fffb" stroke-width="5">
        <path id="tick-12" d="M0-101V-86"/>
        <path id="tick-1" d="M0-101V-90" transform="rotate(30)"/>
        <path id="tick-2" d="M0-101V-90" transform="rotate(60)"/>
        <path id="tick-3" d="M0-101V-86" transform="rotate(90)"/>
        <path id="tick-4" d="M0-101V-90" transform="rotate(120)"/>
        <path id="tick-5" d="M0-101V-90" transform="rotate(150)"/>
        <path id="tick-6" d="M0-101V-86" transform="rotate(180)"/>
        <path id="tick-7" d="M0-101V-90" transform="rotate(210)"/>
        <path id="tick-8" d="M0-101V-90" transform="rotate(240)"/>
        <path id="tick-9" d="M0-101V-86" transform="rotate(270)"/>
        <path id="tick-10" d="M0-101V-90" transform="rotate(300)"/>
        <path id="tick-11" d="M0-101V-90" transform="rotate(330)"/>
      </g>
    </g>
    <g id="chain-orbit" fill="none" stroke="#79e7df" stroke-width="5">
      <ellipse id="chain-path-a" cx="0" cy="0" rx="75" ry="30" transform="rotate(-24)" stroke-dasharray="12 8"/>
      <ellipse id="chain-path-b" cx="0" cy="0" rx="75" ry="30" transform="rotate(24)" stroke-dasharray="12 8"/>
    </g>
    <g id="core" fill="#d9fffb" stroke="#2d7f83" stroke-width="4">
      <circle id="core-disc" cx="0" cy="0" r="18"/>
      <path id="clock-hand-long" d="M0 3V-47" fill="none" stroke="#d9fffb" stroke-width="7" stroke-linecap="round"/>
      <path id="clock-hand-short" d="M-2 2L31 23" fill="none" stroke="#79e7df" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
