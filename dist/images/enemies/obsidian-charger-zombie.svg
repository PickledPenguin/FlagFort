<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -52 116 104" role="img" aria-labelledby="title description">
  <title id="title">Obsidian Charger zombie</title>
  <desc id="description">A broad volcanic zombie armored in jagged obsidian with a wedge-shaped headplate, braced fists, and glowing seams built for smashing fortifications.</desc>
  <defs id="obsidian-charger-definitions">
    <linearGradient id="obsidian-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51495b"/>
      <stop offset=".5" stop-color="#292630"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
  </defs>
  <g id="obsidian-charger-zombie">
    <g id="braced-arms" fill="#536b53" stroke="#26342a" stroke-width="3">
      <path id="upper-arm" d="M10-20c17-14 32-12 41-3l-8 12c-10-6-17-5-27 4Z"/>
      <path id="lower-arm" d="M10 20c17 14 32 12 41 3l-8-12c-10 6-17 5-27-4Z"/>
      <circle id="upper-fist" cx="45" cy="-20" r="10"/>
      <circle id="lower-fist" cx="45" cy="20" r="10"/>
    </g>
    <circle id="body" cx="-4" r="30" fill="#587258" stroke="#26342a" stroke-width="3"/>
    <g id="obsidian-armor" fill="url(#obsidian-gradient)" stroke="#141419" stroke-width="3" stroke-linejoin="round">
      <path id="charging-headplate" d="m-38 0 19-31L10-26 29-11 16 0 29 11 10 26l-29 5Z"/>
      <path id="upper-shoulder" d="M-11-28 15-37 29-20 18-12Z"/>
      <path id="lower-shoulder" d="m-11 28 26 9 14-17-11-8Z"/>
    </g>
    <g id="lava-seams" fill="none" stroke="#ff7a2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path id="headplate-seam" d="m-27-6 11 6-11 7"/>
      <path id="upper-seam" d="m-5-27 7 8 9-3"/>
      <path id="lower-seam" d="m-5 27 7-8 9 3"/>
    </g>
    <g id="armor-highlights" fill="none" stroke="#71677d" stroke-width="2" stroke-linecap="round" opacity=".8">
      <path id="headplate-highlight" d="m-20-24 24 3 14 10"/>
      <path id="shoulder-highlight" d="m10-31 10 9"/>
    </g>
    <g id="eyes" fill="#ffd47a" stroke="#1c1b20" stroke-width="1.5">
      <path id="upper-eye" d="m6-12 13 2-11 6Z"/>
      <path id="lower-eye" d="m6 12 13-2-11-6Z"/>
    </g>
    <g id="charge-dust" fill="#6c4a42" opacity=".8">
      <ellipse id="dust-cloud" cx="-43" cy="35" rx="13" ry="6"/>
      <circle id="dust-grain" cx="-52" cy="24" r="3"/>
    </g>
  </g>
</svg>
