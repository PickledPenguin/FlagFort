<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -54 120 108" role="img" aria-labelledby="title description">
  <title id="title">Ruin Siren zombie</title>
  <desc id="description">A wasteland signal caller with a red emergency siren, radio backpack, antenna array, and a hand-held broadcast switch for rallying reinforcements.</desc>
  <defs id="ruin-siren-definitions">
    <linearGradient id="siren-lens-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb07c"/>
      <stop offset=".5" stop-color="#e44b39"/>
      <stop offset="1" stop-color="#8b292a"/>
    </linearGradient>
  </defs>
  <g id="ruin-siren-zombie">
    <g id="broadcast-wave" fill="none" stroke="#eb6650" stroke-width="3" stroke-linecap="round">
      <path id="broadcast-wave-inner" d="M-34-26c-8-8-8-17 0-25"/>
    </g>
    <g id="radio-pack">
      <rect id="radio-case" x="-43" y="-27" width="31" height="54" rx="5" fill="#4d5852" stroke="#252f2b" stroke-width="3"/>
      <path id="radio-panel" d="M-37 4h19v15h-19Z" fill="#303b36" stroke="#202925" stroke-width="2"/>
      <circle id="radio-dial" cx="-31" cy="11" r="3" fill="#b7d951"/>
      <path id="antenna-one" d="m-35-26-7-25m18 24 4-23" stroke="#303936" stroke-width="3" stroke-linecap="round"/>
      <circle id="antenna-light" cx="-20" cy="-50" r="3" fill="#e95442"/>
    </g>
    <g id="hands" fill="#5f7863" stroke="#2b4034" stroke-width="2.5">
      <circle id="switch-hand" cx="35" cy="-20" r="9"/>
      <circle id="lower-hand" cx="35" cy="20" r="9"/>
    </g>
    <circle id="body" r="28" fill="#607d68" stroke="#2b4034" stroke-width="3"/>
    <path id="salvaged-vest" d="M-19-21-6-12 8-21 21-9 15 27-15 27-22-8Z" fill="#77705b" stroke="#403d34" stroke-width="2.5"/>
    <g id="emergency-siren">
      <path id="siren-bracket" d="M-18-25v-9h20v9" fill="none" stroke="#2b3431" stroke-width="4"/>
      <path id="siren-lens" d="M-15-35c0-13 14-17 24-9 3 3 4 6 4 9Z" fill="#e44b39" stroke="#692729" stroke-width="3"/>
      <path id="siren-highlight" d="M-7-42c5-4 10-2 13 1" fill="none" stroke="#ffd0a8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="eyes" fill="#efffc8" stroke="#2b4034" stroke-width="1.5">
      <ellipse id="upper-eye" cx="8" cy="-10" rx="6.5" ry="4.5" transform="rotate(20 8 -10)"/>
      <ellipse id="lower-eye" cx="8" cy="10" rx="6.5" ry="4.5" transform="rotate(-20 8 10)"/>
    </g>
    <g id="pupils" fill="#d64739">
      <circle id="upper-pupil" cx="11" cy="-9" r="2.5"/>
      <circle id="lower-pupil" cx="11" cy="9" r="2.5"/>
    </g>
    <g id="broadcast-switch">
      <rect id="switch-case" x="39" y="-27" width="15" height="18" rx="3" fill="#3d4843" stroke="#222c28" stroke-width="2"/>
      <circle id="switch-button" cx="47" cy="-19" r="4" fill="#e65340"/>
    </g>
  </g>
</svg>
