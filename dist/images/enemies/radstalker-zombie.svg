<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -50 110 100" role="img" aria-labelledby="title description">
  <title id="title">Radstalker zombie</title>
  <desc id="description">A lean irradiated zombie in a torn hazard hood, stalking forward with luminous claws and a cracked radiation canister.</desc>
  <defs id="radstalker-definitions">
    <radialGradient id="radstalker-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#efff9d"/>
      <stop offset="1" stop-color="#79d63c"/>
    </radialGradient>
  </defs>
  <g id="radstalker-zombie">
    <g id="fallout-trail" fill="#a9ec5a" opacity=".65">
      <circle id="fallout-speck-one" cx="-43" cy="-25" r="3"/>
      <circle id="fallout-speck-two" cx="-48" cy="10" r="2"/>
      <circle id="fallout-speck-three" cx="-34" cy="34" r="2.5"/>
    </g>
    <g id="reaching-arms" fill="none" stroke="#587663" stroke-width="9" stroke-linecap="round">
      <path id="upper-arm" d="M9-15 28-28 43-21"/>
      <path id="lower-arm" d="M10 15 30 26 43 17"/>
    </g>
    <g id="glowing-claws" fill="none" stroke="#cfff71" stroke-width="3" stroke-linecap="round">
      <path id="upper-claws" d="m42-21 10-6m-9 7 11 1m-12-1 7 8"/>
      <path id="lower-claws" d="m42 17 10-6m-9 7 11 1m-12-1 7 8"/>
    </g>
    <ellipse id="body" cx="-5" rx="28" ry="25" fill="#56765f" stroke="#293d33" stroke-width="3"/>
    <path id="torn-hazard-hood" d="M-31-18-14-35 13-31 29-14 24 5 9-17-12-17-23 4Z" fill="#c4a83e" stroke="#5e572d" stroke-width="3" stroke-linejoin="round"/>
    <path id="hood-tear" d="m-14-31 7 9 8-9 8 11" fill="none" stroke="#514c2b" stroke-width="2.5"/>
    <rect id="radiation-canister" x="-39" y="4" width="19" height="25" rx="5" fill="#59665d" stroke="#27352e" stroke-width="3" transform="rotate(12 -29 16)"/>
    <circle id="canister-core" cx="-30" cy="16" r="6" fill="url(#radstalker-glow)" stroke="#436828" stroke-width="2"/>
    <g id="eyes" fill="#f5ffd3" stroke="#2d4637" stroke-width="1.5">
      <path id="upper-eye" d="m5-12 14 3-12 6Z"/>
      <path id="lower-eye" d="m5 12 14-3-12-6Z"/>
    </g>
    <g id="pupils" fill="#72c83c">
      <circle id="upper-pupil" cx="12" cy="-8" r="2.5"/>
      <circle id="lower-pupil" cx="12" cy="8" r="2.5"/>
    </g>
    <path id="warning-stripe" d="M-24 8-6 24" stroke="#d8c64b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
