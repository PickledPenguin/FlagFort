      <path id="right-eye" d="m27-4 14-1 3 8-15 2Z" fill="#f2ff9a"/>
      <path id="roaring-mouth" d="m24 21 11-9 12 11 10-9" fill="none" stroke-width="6" stroke-linecap="round"/>
