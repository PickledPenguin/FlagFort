<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 180 180" role="img" aria-labelledby="title description" version="1.1" id="reactor-revenant-broken-svg" sodipodi:docname="reactor-revenant-broken.svg" inkscape:version="1.4.4">
  <title id="title">Reactor Revenant with breached containment</title>
  <desc id="description">The wasteland revenant after its reactor armor has ruptured, exposing a blazing radioactive core amid broken plates, leaking canisters, and a flashing siren.</desc>
  <defs id="definitions">
    <radialGradient id="exposed-reactor-core">
      <stop id="core-white" offset="0" stop-color="#fbffd1"/>
      <stop id="core-yellow" offset=".25" stop-color="#e5ff64"/>
      <stop id="core-green" offset=".62" stop-color="#8bd63d"/>
      <stop id="core-dark" offset="1" stop-color="#267044"/>
    </radialGradient>
    <linearGradient id="broken-steel" x1="0" y1="0" x2="1" y2="1">
      <stop id="steel-highlight" offset="0" stop-color="#747e6a"/>
      <stop id="steel-shadow" offset="1" stop-color="#29322d"/>
    </linearGradient>
  </defs>
  <g id="reactor-revenant-broken" transform="translate(90 92)" stroke-linejoin="round">
    <g id="radiation-aura" fill="#c9f756">
      <path id="plume-one" d="M-72-44c-9-14 10-19 0-35 21 11 19 28 8 38Z"/>
      <path id="plume-two" d="M66-48c-7-12 9-16 0-30 18 10 17 25 8 33Z"/>
      <circle id="fallout-one" cx="-78" cy="28" r="4"/>
      <circle id="fallout-two" cx="75" cy="32" r="4.5"/>
      <circle id="fallout-three" cx="-48" cy="-70" r="3"/>
    </g>
    <g id="massive-arms" fill="#637357" stroke="#29392f" stroke-width="6">
      <path id="left-arm" d="M-40-25-75-12-84 17-67 35-43 17Z"/>
      <path id="right-upper-arm" d="M35-32 68-52 84-33 69-7 43 0Z"/>
      <path id="right-lower-arm" d="M41 8 79 19 78 44 50 54 29 32Z"/>
    </g>
    <g id="ruptured-canisters" stroke="#25352e" stroke-width="5">
      <path id="left-canister" d="M-70 7h18v43h-18Z" fill="#66763a"/>
      <path id="right-canister" d="M56-35h18V5H56Z" fill="#66763a"/>
      <path id="left-canister-break" d="m-69 21 7 6-6 8 13 5" fill="none" stroke="#d7fb62" stroke-width="4"/>
      <path id="right-canister-break" d="m59-22 11 6-9 8 10 6" fill="none" stroke="#d7fb62" stroke-width="4"/>
    </g>
    <ellipse id="body" cx="-2" cy="4" rx="57" ry="61" fill="#596e51" stroke="#263a2d" stroke-width="7"/>
    <circle id="exposed-core" cx="7" cy="16" r="37" fill="url(#exposed-reactor-core)" stroke="#28643d" stroke-width="7"/>
    <g id="irradiated-fissures" fill="none" stroke="#c8f85d" stroke-width="5" stroke-linecap="round">
      <path id="upper-fissure" d="M-38-28-21-17-10 0"/>
      <path id="left-fissure" d="M-45 9-29 19-20 39"/>
      <path id="lower-fissure" d="M-21 49-4 34 13 50 31 39"/>
      <path id="arm-fissure" d="M49-42 60-34 54-21"/>
    </g>
    <g id="shattered-containment" fill="url(#broken-steel)" stroke="#202824" stroke-width="5">
      <path id="left-helmet-shard" d="M-45-30-34-62-10-74-8-42-21-17Z"/>
      <path id="right-helmet-shard" d="M15-43 20-65 42-42 41-20 28-12Z"/>
      <path id="upper-left-shard" d="M-49-25-21-37-11-20-31-7Z"/>
      <path id="upper-right-shard" d="M21-28 39-32 51-9 37 2Z"/>
      <path id="lower-left-shard" d="M-47 32-25 22-17 49-38 59Z"/>
      <path id="lower-right-shard" d="M28 43 41 35 44 60 23 68Z"/>
    </g>
    <g id="warning-siren" transform="translate(0 -76)" stroke="#352b26" stroke-width="4">
      <path id="bent-siren-mount" d="M-8 14-5 3H8l-2 11" fill="#555e51"/>
      <path id="flashing-siren-dome" d="M-13 4c0-19 26-19 26 0Z" fill="#ff5d42"/>
      <g id="siren-rays" fill="none" stroke="#ffba61" stroke-width="4" stroke-linecap="round">
        <path id="left-ray" d="M-17-6-27-12"/>
        <path id="top-ray" d="M0-14v-10"/>
        <path id="right-ray" d="m17-6 10-6"/>
      </g>
    </g>
    <g id="face" stroke="#203029" stroke-width="3">
