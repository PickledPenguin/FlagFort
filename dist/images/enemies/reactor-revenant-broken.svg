      <path id="fallen-shard-two" d="m48 71 10-19 17 16Z"/>
      <path id="fallen-shard-three" d="m-12 75 9-14 13 14Z"/>
    </g>
    <g id="toxic-runoff" fill="none" stroke="#b8ed4e" stroke-width="5" stroke-linecap="round">
      <path id="left-runoff" d="M-79 73-57 64-42 73-22 65"/>
      <path id="right-runoff" d="M17 71 39 61 55 71 79 59"/>
    </g>
  </g>
</svg>
