<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Clockwork ironwood tree</title>
  <desc id="description">A sturdy ironwood tree fitted with brass bands, copper pipes, and gear-shaped foliage.</desc>
