    <path id="brass-bands" d="M39 50h20M39 63h21" fill="none" stroke="#c8953f" stroke-width="4" stroke-linecap="round"/>
    <path id="branches" d="M47 43 27 29M54 42l17-16M48 32 39 18" fill="none" stroke="#513c2e" stroke-width="8" stroke-linecap="round"/>
    <path id="canopy" d="M10 29c0-10 11-16 20-12 5-10 21-12 29-4 10-7 24 1 22 12 12 4 10 19-1 22-8 3-14-1-18-6-8 8-21 7-27-1-9 7-25 2-24-9Z" fill="#4f6651" stroke="#26372f" stroke-width="5" stroke-linejoin="round"/>
