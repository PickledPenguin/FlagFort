    <ellipse id="shadow" cx="48" cy="88" rx="38" ry="6" fill="#17191d" opacity=".72"/>
    <path id="roots" d="M41 69 27 88h18l5-11 7 11h17L57 68Z" fill="#684b34" stroke="#29282a" stroke-width="5" stroke-linejoin="round"/>
