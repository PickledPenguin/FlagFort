    <ellipse id="shadow" cx="48" cy="87" rx="37" ry="6" fill="#132827" opacity=".72"/>
    <path id="left-shell" d="m9 76 15-28 24-8 7 27-15 18H19Z" fill="#464c45" stroke="#213531" stroke-width="6" stroke-linejoin="round"/>
    <path id="right-shell" d="m54 67 2-27 23 10 10 25-17 12Z" fill="#535951" stroke="#213531" stroke-width="6" stroke-linejoin="round"/>
    <path id="empty-seam" d="m46 49-8 11 9 8m12-20 8 10-9 10" fill="none" stroke="#272d29" stroke-width="5" stroke-linecap="round"/>
    <path id="gold-traces" d="m34 55 4-2m29 4 4 3" fill="none" stroke="#9e7b36" stroke-width="3" stroke-linecap="round"/>
  </g>
