    <ellipse id="shadow" cx="48" cy="87" rx="37" ry="6" fill="#17191d" opacity=".74"/>
    <path id="ore-body" d="m8 75 15-32 26-14 29 15 11 31-18 12H27Z" fill="#41464d" stroke="#24282d" stroke-width="6" stroke-linejoin="round"/>
