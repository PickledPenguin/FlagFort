    <path id="plate-seams" d="m34 52 3 26m18-36 7 36m-37-13 47-3" fill="none" stroke="#ffe29a" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <g id="rivets" fill="#fff0b3" stroke="#735126" stroke-width="1.5">
      <circle cx="33" cy="59" r="2.5"/><circle cx="55" cy="51" r="2.5"/><circle cx="64" cy="69" r="2.5"/><circle cx="41" cy="70" r="2.5"/>
    </g>
  </g>
