<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Clockwork brass deposit</title>
  <desc id="description">Bright brass plates and golden ore veins gleam from a riveted black rock.</desc>
