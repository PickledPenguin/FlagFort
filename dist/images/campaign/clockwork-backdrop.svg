      <path d="M94 137V46h25v91Zm570 0V39h27v98Z"/>
      <path d="M89 45h35v10H89Zm570-7h37v11h-37Z" fill="#ad7938"/>
    </g>
    <g id="clockwork-steam" fill="none" stroke="#d0d4cf" stroke-width="12" stroke-linecap="round" opacity=".3">
      <path d="M106 35c-19-15 15-21-3-37"/><path d="M678 29c20-15-14-24 5-39"/>
