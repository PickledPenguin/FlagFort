<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="clockwork-backdrop-title clockwork-backdrop-description">
  <title id="clockwork-backdrop-title">Clockwork Citadel campaign backdrop</title>
  <desc id="clockwork-backdrop-description">A vast brass clock tower overlooks gearworks, ironwood trees, smokestacks, and aether-powered fortifications.</desc>
  <g id="clockwork-backdrop">
    <defs>
      <linearGradient id="clockwork-sky-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#202b3d"/>
        <stop offset=".58" stop-color="#4c4a4a"/>
        <stop offset="1" stop-color="#826241"/>
      </linearGradient>
      <linearGradient id="clockwork-brass-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e2b85d"/>
        <stop offset="1" stop-color="#8a5b2c"/>
      </linearGradient>
      <radialGradient id="clockwork-aether-glow-gradient">
        <stop offset="0" stop-color="#a4fff0" stop-opacity=".8"/>
        <stop offset="1" stop-color="#63d9d4" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect id="clockwork-sky" width="800" height="180" fill="url(#clockwork-sky-gradient)"/>
    <circle id="clockwork-aether-glow" cx="400" cy="87" r="86" fill="url(#clockwork-aether-glow-gradient)" opacity=".32"/>
    <g id="clockwork-clouds" fill="#bec3c2" opacity=".15">
