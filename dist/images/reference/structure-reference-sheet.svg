  <g id="turret-wood" transform="translate(310 1000)">
    <title>Wood turret</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Wood Turret</text>
    <g id="turret-wood-artwork">
      <circle r="36" fill="#b77a45" class="base-outline"/>
      <rect x="0" y="-8" width="44" height="16" fill="#202d28"/>
      <circle r="17" fill="#b77a45"/>
    </g>
  </g>
  <g id="turret-stone" transform="translate(610 1000)">
    <title>Stone turret</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Stone Turret</text>
    <g id="turret-stone-artwork">
      <circle r="36" fill="#aeb7bc" class="base-outline"/>
      <rect x="0" y="-8" width="44" height="16" fill="#202d28"/>
      <circle r="17" fill="#aeb7bc"/>
    </g>
