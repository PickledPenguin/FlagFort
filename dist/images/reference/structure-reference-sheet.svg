  <g id="door-proximity-transparency-example" transform="translate(700 1170)">
    <title>Door at minimum proximity opacity</title>
    <text class="cell-label" x="-190" y="4">DOOR PROXIMITY</text>
    <g id="door-proximity-artwork" opacity=".38">
      <circle r="34" fill="#b77a45" class="base-outline"/>
      <g fill="#2b241d"><circle cx="-11" cy="-11" r="5"/><circle cx="11" cy="-11" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/></g>
    </g>
    <text class="sheet-note" x="285" y="4">minimum Canvas globalAlpha = 0.38 inside the 112px fade radius</text>
  </g>
</svg>
