  <g id="turret-gold" transform="translate(910 1000)">
    <title>Gold turret</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Gold Turret</text>
    <g id="turret-gold-artwork">
