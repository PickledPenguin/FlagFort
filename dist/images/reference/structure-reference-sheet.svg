      <circle r="39" fill="#aeb7bc" class="base-outline"/>
      <path d="M0 0H108" fill="none" stroke="#aeb7bc" stroke-width="9"/>
      <circle cx="108" r="12" fill="#eff7e9"/>
    </g>
  </g>
  <g id="harvester-gold" transform="translate(910 810)">
    <title>Gold harvester</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Gold Harvester</text>
    <g id="harvester-gold-artwork">
      <circle r="39" fill="#f6c945" class="base-outline"/>
      <path d="M0 0H120" fill="none" stroke="#f6c945" stroke-width="9"/>
