      <g fill="#2b241d"><circle cx="-11" cy="-11" r="5"/><circle cx="11" cy="-11" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/></g>
    </g>
  </g>
  <g id="door-gold" transform="translate(910 620)">
    <title>Gold door</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Gold Door</text>
    <g id="door-gold-artwork">
      <circle r="34" fill="#f6c945" class="base-outline"/>
      <g fill="#2b241d"><circle cx="-11" cy="-11" r="5"/><circle cx="11" cy="-11" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/></g>
    </g>
  </g>
  <g id="door-diamond" transform="translate(1210 620)">
    <title>Diamond door</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Diamond Door</text>
    <g id="door-diamond-artwork">
      <circle r="34" fill="#57e5ef" class="base-outline"/>
      <g fill="#2b241d"><circle cx="-11" cy="-11" r="5"/><circle cx="11" cy="-11" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/></g>
    </g>
  </g>

  <g id="harvester-wood" transform="translate(310 810)">
    <title>Wood harvester</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Wood Harvester</text>
    <g id="harvester-wood-artwork">
      <circle r="39" fill="#b77a45" class="base-outline"/>
      <path d="M0 0H98" fill="none" stroke="#b77a45" stroke-width="9"/>
      <circle cx="98" r="12" fill="#eff7e9"/>
    </g>
  </g>
