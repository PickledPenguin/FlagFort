  </g>
  <g id="spikes-gold" transform="translate(910 430)">
    <title>Gold spikes</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Gold Spikes</text>
    <g id="spikes-gold-artwork"><path d="M42 0 22.516 13 21 36.373 0 26-21 36.373-22.516 13-42 0-22.516-13-21-36.373 0-26 21-36.373 22.516-13Z" fill="#f6c945" class="base-outline"/></g>
  </g>
  <g id="spikes-diamond" transform="translate(1210 430)">
    <title>Diamond spikes</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Diamond Spikes</text>
    <g id="spikes-diamond-artwork"><path d="M42 0 22.516 13 21 36.373 0 26-21 36.373-22.516 13-42 0-22.516-13-21-36.373 0-26 21-36.373 22.516-13Z" fill="#57e5ef" class="base-outline"/></g>
  </g>

  <g id="door-wood" transform="translate(310 620)">
    <title>Wood door</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Wood Door</text>
    <g id="door-wood-artwork">
      <circle r="34" fill="#b77a45" class="base-outline"/>
      <g fill="#2b241d"><circle cx="-11" cy="-11" r="5"/><circle cx="11" cy="-11" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/></g>
    </g>
  </g>
  <g id="door-stone" transform="translate(610 620)">
    <title>Stone door</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Stone Door</text>
