<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1260">
  <title>Flagfall structure reference sheet</title>
  <desc>Reference-only translation of the Canvas structure renderer at full health and neutral orientation.</desc>
  <style>
    .sheet-title { fill: #f0f7db; font: 700 28px sans-serif; text-anchor: middle; }
    .sheet-note { fill: #aebdaf; font: 14px sans-serif; text-anchor: middle; }
    .column-label, .row-label { fill: #dce8d7; font: 700 17px sans-serif; text-anchor: middle; }
    .cell-label { fill: #dce8d7; font: 13px sans-serif; text-anchor: middle; }
    .cell-background { fill: #12271b; stroke: #385044; stroke-width: 1; }
    .base-outline { stroke: #2b241d; stroke-width: 4; }
    .wall-brace { fill: none; stroke: #fff; stroke-width: 4; opacity: .32; }
  </style>

  <g id="sheet-background">
    <rect width="1400" height="1260" fill="#09170f"/>
  </g>

  <g id="sheet-labels">
    <text class="sheet-title" x="700" y="42">FLAGFALL STRUCTURE REFERENCE</text>
    <text class="sheet-note" x="700" y="70">Canvas renderer translation · neutral orientation · full health · reference only</text>
    <text class="column-label" x="310" y="112">WOOD</text>
    <text class="column-label" x="610" y="112">STONE</text>
    <text class="column-label" x="910" y="112">GOLD</text>
    <text class="column-label" x="1210" y="112">DIAMOND</text>
    <text class="row-label" x="82" y="245">WALL</text>
    <text class="row-label" x="82" y="435">SPIKES</text>
    <text class="row-label" x="82" y="625">DOOR</text>
    <text class="row-label" x="82" y="815">HARVESTER</text>
    <text class="row-label" x="82" y="1005">TURRET</text>
  </g>

  <g id="wall-wood" transform="translate(310 240)">
    <title>Wood wall</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Wood Wall</text>
    <g id="wall-wood-artwork">
      <circle r="33" fill="#b77a45" class="base-outline"/>
      <path d="M-17-17 17 17M17-17-17 17" class="wall-brace"/>
    </g>
  </g>
  <g id="wall-stone" transform="translate(610 240)">
    <title>Stone wall</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Stone Wall</text>
    <g id="wall-stone-artwork">
      <circle r="33" fill="#aeb7bc" class="base-outline"/>
      <path d="M-17-17 17 17M17-17-17 17" class="wall-brace"/>
    </g>
  </g>
  <g id="wall-gold" transform="translate(910 240)">
    <title>Gold wall</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Gold Wall</text>
    <g id="wall-gold-artwork">
      <circle r="33" fill="#f6c945" class="base-outline"/>
      <path d="M-17-17 17 17M17-17-17 17" class="wall-brace"/>
    </g>
  </g>
  <g id="wall-diamond" transform="translate(1210 240)">
    <title>Diamond wall</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Diamond Wall</text>
    <g id="wall-diamond-artwork">
      <circle r="33" fill="#57e5ef" class="base-outline"/>
      <path d="M-17-17 17 17M17-17-17 17" class="wall-brace"/>
    </g>
  </g>

  <g id="spikes-wood" transform="translate(310 430)">
    <title>Wood spikes</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Wood Spikes</text>
    <g id="spikes-wood-artwork"><path d="M42 0 22.516 13 21 36.373 0 26-21 36.373-22.516 13-42 0-22.516-13-21-36.373 0-26 21-36.373 22.516-13Z" fill="#b77a45" class="base-outline"/></g>
  </g>
  <g id="spikes-stone" transform="translate(610 430)">
    <title>Stone spikes</title>
    <rect class="cell-background" x="-140" y="-85" width="280" height="170" rx="10"/>
    <text class="cell-label" y="-63">Stone Spikes</text>
